<div class="dashboard-container">
    <header class="dash-header">
        <div class="header-left">
            <img src="assets/images/logo.png" alt="Logo" class="mini-logo">
            <h2>Parent Dashboard</h2>
        </div>
        <button class="logout-btn" onclick="loadSection('role-selection')">Logout</button>
    </header>

    <div class="dash-content">
        <div class="child-switcher">
            <span class="active-child">Ravi (Class 10A)</span>
            <button class="add-child-btn"><i class="fa-solid fa-plus"></i> Add Child</button>
        </div>

        <div class="stat-card blue-bg" style="margin-bottom: 20px;">
            <h4>Today's Attendance</h4>
            <p style="font-size: 20px; font-weight: bold; color: #3F8F29;">Present</p>
        </div>

        <h3 class="section-title">Today's E-Diary</h3>
        <div class="diary-card">
            <div class="diary-header">
                <span class="badge class-badge">Math</span>
                <span class="time">Today</span>
            </div>
            <p>Complete chapter 5 exercises and submit tomorrow.</p>
        </div>

        <h3 class="section-title">Notice Board</h3>
        <div class="notice-card">
            <p><strong>School Reopening:</strong> School will reopen on Monday after Dussehra holidays.</p>
        </div>
    </div>
</div>
