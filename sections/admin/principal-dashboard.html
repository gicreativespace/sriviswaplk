<div class="dashboard-container">
    <header class="dash-header">
        <div class="header-left">
            <img src="assets/images/logo.png" alt="Logo" class="mini-logo">
            <h2>Principal Dashboard</h2>
        </div>
        <button class="logout-btn" onclick="loadSection('role-selection')">Logout</button>
    </header>

    <div class="dash-content">
        <div class="stats-grid">
            <div class="stat-card blue-bg">
                <h4>Total Staff</h4>
                <p>12</p>
            </div>
            <div class="stat-card green-bg">
                <h4>Pending Approvals</h4>
                <p>3</p>
            </div>
        </div>

        <h3 class="section-title">Pending Approvals (E-Diary & Notices)</h3>
        <div class="approval-card">
            <div class="approval-header">
                <span class="badge class-badge">Class 10A</span>
                <span class="time">10 mins ago</span>
            </div>
            <p class="approval-text"><strong>Math:</strong> Complete chapter 5 exercises.</p>
            <div class="approval-actions">
                <button class="btn-approve" onclick="alert('Approved!')"><i class="fa-solid fa-check"></i> Approve</button>
                <button class="btn-reject" onclick="alert('Rejected!')"><i class="fa-solid fa-xmark"></i> Reject</button>
            </div>
        </div>

        <button class="btn-primary" style="margin-top: 20px;" onclick="alert('Manage Staff Page (Phase 2)')">
            <i class="fa-solid fa-users"></i> Manage Staff & Incharges
        </button>
    </div>
</div>
