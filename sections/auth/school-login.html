<div class="auth-container">
    <div class="auth-header">
        <button class="back-btn" onclick="loadSection('role-selection')"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 id="school-login-title">School Portal Login</h2>
        <p>Enter your phone number and PIN</p>
    </div>
    <form id="school-login-form">
        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="10-digit mobile number" required>
        </div>
        <div class="input-group">
            <label>Master PIN</label>
            <input type="password" placeholder="Enter 6-digit PIN" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>
</div>
