<div class="role-container">
    <div class="role-header">
        <h1>Welcome to<br><span>Sri Viswa</span></h1>
        <p>Please select your portal to continue</p>
    </div>
    
    <div class="cards-container">
        <div class="role-card" onclick="selectPortal('school')">
            <div class="icon-box blue-icon"><i class="fa-solid fa-school"></i></div>
            <div class="text-box">
                <h3>School Portal</h3>
                <p>Staff, Teachers & Principal</p>
            </div>
            <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>

        <div class="role-card" onclick="selectPortal('parent')">
            <div class="icon-box green-icon"><i class="fa-solid fa-people-roof"></i></div>
            <div class="text-box">
                <h3>Parent Portal</h3>
                <p>Track your child's progress</p>
            </div>
            <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
    </div>
</div>
